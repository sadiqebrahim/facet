[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facet"
version = "0.1.0"
description = "Face analysis, filtering and ranking - research stage"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "opencv-python>=4.8",
    "onnxruntime-gpu>=1.18",
    "insightface>=0.7",
    "pillow>=10",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0", "transformers>=4.40"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
