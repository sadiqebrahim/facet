# Ranking configuration (docs/RESEARCH.md section 9.3).
# Weights and membership-function shapes live here, never in source.

hard_filters:
  min_quality: 0.4
  min_face_pixels: 80
  min_detector_confidence: 0.5

preferences:
  age:
    weight: 0.30
    # Trapezoidal membership with soft shoulders, so 36 does not fall off a cliff when
    # the user asked for 25-35. Shoulder width scales with the face's own predicted age
    # uncertainty: a face at 35 +/- 9 should not match as strongly as one at 35 +/- 2.
    shoulder_years: 5
    scale_shoulder_by_uncertainty: true
  gender:
    weight: 0.20
    # Soft by default. A hard filter on a 98%-accurate classifier silently discards
    # true matches, biased toward the groups where the classifier is weakest.
    mode: soft
    min_confidence: 0.6
    report_excluded_uncertain: true
  attractiveness:
    weight: 0.50
    # E7 finding: absolute score thresholds ("attractiveness above 4.0") do NOT survive a
    # domain change - the scale is defined by whichever rater pool produced the training
    # labels, and two reasonable pools disagreed on 80% of a top-100. Rank within the
    # indexed collection instead: scale-free, well-defined, and honest about what it means.
    target: top_percentile
    percentile: 0.80
    # Still sourced from the distribution head so the model's own spread is accounted for,
    # and so the UI can show P(rating >= r) alongside the percentile.
    use_distribution: true

# E7: the model reproduces its TRAINING rater pool's group-level preferences, not any
# universal ones - measured placement bias up to 0.215 percentile points across
# gender/ethnicity groups. Ranking all groups together as if scores were comparable is not
# supportable without disclosing that. Options: 'global' (bias surfaced in the UI) or
# 'within_group'.
cross_group_# E12: confidence policy. Raw model spread is NEVER shown - measured coverage ranged from
# 0.065 to 0.998 at a 68% nominal level across five methods. Conformal recalibration fixes
# this in-domain, but its guarantee assumes exchangeability: intervals calibrated on one
# collection delivered only 43-78% of nominal coverage on a shifted domain. So calibration
# is per-collection, and intervals are suppressed rather than shown when the face is
# out-of-distribution.
confidence:
  method: conformal
  channel: combined          # sqrt(aleatoric^2 + epistemic^2); see e12_uncertainty
  calibration: per_collection
  calibration_sample_size: 500
  levels: [0.68, 0.90, 0.95]
  ood_gate:
    enabled: true
    on_trigger: suppress_numeric_confidence   # suppress | widen
  # The plain LDL head's spread tracks TRUE rater disagreement at only r=0.139, so the
  # "this face is polarising" badge is driven by the hybrid head instead (r=0.344).
  polarising_signal_head: hybrid

ranking:
  mode: global
  surface_measured_bias: true

# Each criterion's match is multiplied by its confidence before weighting, so an
# uncertain criterion contributes little in either direction rather than contributing a
# confident-looking wrong answer. Each term is also a row in the "why this result" panel.
confidence_weighting: true

# E12: confidence policy. Raw model spread is NEVER shown - measured coverage ranged from
# 0.065 to 0.998 at a 68% nominal level across five methods. Conformal recalibration fixes
# this in-domain, but its guarantee assumes exchangeability: intervals calibrated on one
# collection delivered only 43-78% of nominal coverage on a shifted domain. So calibration
# is per-collection, and intervals are suppressed rather than shown when the face is
# out-of-distribution.
confidence:
  method: conformal
  channel: combined          # sqrt(aleatoric^2 + epistemic^2); see e12_uncertainty
  calibration: per_collection
  calibration_sample_size: 500
  levels: [0.68, 0.90, 0.95]
  ood_gate:
    enabled: true
    on_trigger: suppress_numeric_confidence   # suppress | widen
  # The plain LDL head's spread tracks TRUE rater disagreement at only r=0.139, so the
  # "this face is polarising" badge is driven by the hybrid head instead (r=0.344).
  polarising_signal_head: hybrid

ranking:
  sort_by: relevance      # relevance | attractiveness | confidence | age_match | quality
  limit: 100
  page_size: 50
