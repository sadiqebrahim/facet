# Model registry. Every entry carries its license so a --commercial-safe run can
# mechanically exclude non-compliant components (docs/LICENSING.md section 3).
# Nothing in the codebase hard-codes a model path.

detectors:
  scrfd_10g:
    backend: insightface
    pack: buffalo_l
    # Both adaptive - see configs/pipeline/align.yaml for the measurements. A single
    # fixed setting fails one of the two regimes badly: the best scene config (d1024,
    # unpadded) has ZERO recall on tight portrait crops.
    det_size: auto      # <=700px longest side -> 640, else 1024
    pad_frac: auto      # unpadded first, padded retry on empty/frame-filling
    license: research-only
    commercial_use: false
  yunet:
    backend: opencv_zoo
    license: Apache-2.0
    commercial_use: true
    note: commercially-clean fallback and CPU path; not yet implemented

encoders:
  arcface_r50:
    backend: insightface
    pack: buffalo_l
    file: w600k_r50.onnx
    dim: 512
    license: research-only
    commercial_use: false
  arcface_r100:
    backend: insightface
    pack: antelopev2
    file: glintr100.onnx
    dim: 512
    license: research-only
    commercial_use: false
  clip_vit_b32:
    backend: huggingface
    model_id: openai/clip-vit-base-patch32
    dim: 512
    license: MIT
    commercial_use: true
  geometry_procrustes86:
    backend: internal
    dim: 178
    license: n/a
    commercial_use: true
    note: uses SCUT-FBP5500's supplied landmarks; a landmark model is needed at inference

attributes:
  age_gender_mivolo:
    backend: mivolo
    weights: hf:iitolstykh/mivolo_v2
    license: Apache-2.0
    commercial_use: true
    status: adopted            # E4: 0.961 gender / 5.14 yr MAE on FairFace
    # E4: MiVOLO scores best on a WIDE crop (full frame 0.961) rather than the tight 112px
    # ArcFace crop (0.943) - it is a face+body model and uses the context. Age/gender needs
    # its own crop protocol: one detection, two crops.
    crop: wide
    crop_margin: 1.0
    # ~190x slower than the retired baseline (24 vs 4628 img/s), so it dominates indexing
    # time. Run lazily on faces that survive quality/query filters, not on every detection.
    run_policy: lazy
    warning: >
      MiVOLO's own weights are Apache-2.0, but its bundled detector is Ultralytics
      YOLOv8 (AGPL-3.0). Only the model definition is vendored (facet/third_party/mivolo);
      yolo_detector.py is excluded and we drive the model with our own SCRFD detector.
      Enforced by tests/test_licensing.py.
    caveat: >
      Weights are Apache-2.0 but the training data includes IMDB-clean, which derives from
      IMDb under non-commercial terms. Apache-2.0 on weights does not launder training-data
      provenance - a question for a lawyer before commercial use. Training data is also not
      fully enumerated, so FairFace contamination in E4's numbers cannot be ruled out.
  age_gender_insightface:
    backend: insightface
    pack: buffalo_l
    file: genderage.onnx
    license: research-only
    commercial_use: false
    status: retired    # E4: 0.809 gender / 10.99 yr MAE on FairFace, and ~3x the disparity

beauty:
  ridge_ldl_arcface_r50:
    encoder: arcface_r50
    head: ridge_ldl
    trained_on: SCUT-FBP5500
    # A model trained on non-commercial data inherits that restriction.
    license: research-only (inherited from training data)
    commercial_use: false
    source_of_truth: >
      Predicted rating on the SCUT-FBP5500 scale, as defined by 60 volunteer raters
      aged 18-27 (mean 21.6) in 2017. This is NOT a measurement of beauty.
