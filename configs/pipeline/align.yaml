# Crop protocol. VERSIONED: cached features are keyed on these values, so changing any
# of them correctly invalidates the feature cache rather than silently mixing
# incompatible features (docs/RESEARCH.md section 2.2).
#
# v2 (E5): margin raised 0.00 -> 0.25. Measured on the production ArcFace+CLIP fusion:
#   transfer to held-out MEBeauty  0.6084 -> 0.6418 Spearman  (+0.033, ~5% relative)
#   in-benchmark SCUT 5-fold PC    0.9398 -> 0.9390           (-0.0008, negligible)
# The two optima disagree - in-benchmark PC peaks at margin 0.00 - and E7 established
# that transfer is the number that predicts whether the product works on real images.
# See experiments/e5_crop_sensitivity/FINDINGS.md.
version: v2
template: arcface_5point
output_size: 112
margin: 0.25       # E5 swept 0.00 / 0.10 / 0.25 / 0.40
interpolation: linear
border_value: 0

# Alignment: the ArcFace 5-point similarity transform. E5 found this is worth +0.023
# transfer for the fusion - real but much smaller than folklore suggests - and is
# actively HARMFUL for ArcFace alone (-0.073), where a plain bbox crop transfers better.
# Revisit if the fusion is ever dropped.
align: template    # template | bbox

# Detection scale and padding. Both are ADAPTIVE, because E5 and E8 measured opposite
# requirements in the two regimes and a single fixed setting fails one of them badly.
#
# det_size: InsightFace resizes so the longest side equals det_size, so small images get
#   UPSCALED. E8 measured that a 350px portrait at det_size 1024 is blown up ~3x and
#   recall collapses to 0.36 - and to 0.00 unpadded. Scenes meanwhile want 1024
#   (recall_all 0.641 vs 0.511 at 640) because their faces are tiny. "auto" routes per
#   image: <=700px longest side -> 640, else 1024.
#
# pad_frac: E5 found portrait recall collapses to 46% unpadded. E8 found padding costs
#   -0.156 recall on faces under 16px in scenes. "auto" runs unpadded first and retries
#   padded only when nothing was found or the top face fills the frame.
#
# Measured on both regimes (portrait recall / scene recall_all / scene recall>=32px):
#   d640  pad0.25   0.9975 / 0.3916 / 0.8570      <- E5 setting, poor on scenes
#   d1024 pad0.00   0.0000 / 0.6580 / 0.8964      <- E8 sweep winner, BLIND to portraits
#   auto  auto      0.9975 / 0.6588 / 0.8995      <- strictly dominant
detect_det_size: auto
detect_pad_frac: auto

# Quality composite (E9). Validated functionally by Error-vs-Reject on LFW's 6000-pair
# protocol: does rejecting low-quality faces reduce recognition error?
#   composite_v2   AUERC 0.0034   (+85% vs random)   <- production
#   face_pixels    AUERC 0.0096   (+58%)
#   composite_v1   AUERC 0.0136   (+41%)  superseded: its size term saturated at 112px and
#                                         silently deleted the strongest signal
#   contrast       AUERC 0.0248   (-8%)   worse than random; removed
quality:
  composite: v2
  weights: {face_size: 0.45, embedding_norm: 0.25, blur: 0.15, det_score: 0.15}
  face_size_log_range_px: [24, 400]
  # Rank-normalised terms MUST use fixed reference quantiles sampled once from the user's
  # collection - otherwise a face's quality score changes depending on what it is indexed
  # alongside.
  rank_reference: per_collection
  rank_reference_sample: 2000
